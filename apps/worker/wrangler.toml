name = "hop"
main = "src/index.ts"
compatibility_date = "2025-04-01"
account_id = "CLOUDFLARE_ACCOUNT_ID_PLACEHOLDER"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

# TABLE_PREFIX is config-managed: CI replaces this placeholder with the
# resolved GitHub variable vars.TABLE_PREFIX before wrangler uploads the
# version, so the binding always matches the prefix the migrations used.
#
# WAKER_MODE / WAKER_URL are also written here by the deploy workflow
# (.github/scripts/configure-waker-mode.mjs) when the optional waker scheduling
# mode is enabled — do not add them by hand (see the README's waker section).
[vars]
TABLE_PREFIX = "TABLE_PREFIX_PLACEHOLDER"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "D1_DATABASE_NAME_PLACEHOLDER"
database_id = "D1_DATABASE_ID_PLACEHOLDER"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "LINKS_KV"
id = "KV_NAMESPACE_ID_PLACEHOLDER"

[triggers]
# Native Cron Trigger — the default scheduler. The deploy workflow removes this
# entire section when WAKER_MODE=waker and WAKER_TRIGGERS=remove (the waker
# platform then calls /_waker/execute instead). Keep the expression
# character-for-character: the waker job is created with the same value.
crons = ["0 3 * * *"]
