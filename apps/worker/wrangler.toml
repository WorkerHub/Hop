name = "hop"
main = "src/index.ts"
compatibility_date = "2025-04-01"
account_id = "CLOUDFLARE_ACCOUNT_ID_PLACEHOLDER"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

# TABLE_PREFIX is config-managed: CI replaces this placeholder with the
# resolved GitHub variable vars.TABLE_PREFIX before wrangler uploads the
# version, so the binding always matches the prefix the migrations used.
[vars]
TABLE_PREFIX = "TABLE_PREFIX_PLACEHOLDER"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "D1_DATABASE_NAME_PLACEHOLDER"
database_id = "D1_DATABASE_ID_PLACEHOLDER"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "LINKS_KV"
id = "KV_NAMESPACE_ID_PLACEHOLDER"

[triggers]
# Native Cron Trigger disabled — waker is the only scheduler now: it POSTs
# /_waker/execute for the `nightly-cleanup` job declared in
# src/services/waker.ts and created by hand in the waker UI.
#
# The empty array is what removes it, on every deploy: Cloudflare deletes all
# Cron Triggers when `crons` is an empty array, but leaves the deployed ones in
# place when `triggers`/`crons` is undefined (i.e. deleting this section would
# keep the old schedule running). Keeping it explicit also makes the state
# idempotent and reviewable. Rollback: restore the previous expression (see the
# README's waker section) and redeploy — the native trigger returns.
crons = []
