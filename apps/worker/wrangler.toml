name = "hop"
main = "src/index.ts"
compatibility_date = "2025-04-01"
account_id = "CLOUDFLARE_ACCOUNT_ID_PLACEHOLDER"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

# TABLE_PREFIX is config-managed: CI replaces this placeholder with the
# resolved GitHub variable vars.TABLE_PREFIX before wrangler uploads the
# version, so the binding always matches the prefix the migrations used.
[vars]
TABLE_PREFIX = "TABLE_PREFIX_PLACEHOLDER"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "D1_DATABASE_NAME_PLACEHOLDER"
database_id = "D1_DATABASE_ID_PLACEHOLDER"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "LINKS_KV"
id = "KV_NAMESPACE_ID_PLACEHOLDER"

[triggers]
# Native Cron Trigger — static: this section is always deployed and the pipeline
# never rewrites it. The waker callback runs next to it (dual run, the cleanup is
# idempotent) as soon as its signing key is bound; switching the schedule over to
# waker alone is a separate, reviewable change that deletes this section (revert
# that commit to roll back). Keep the expression character-for-character: the
# waker job is created with the same value.
crons = ["0 3 * * *"]
