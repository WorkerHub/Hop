name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

# One production deploy at a time; a newer pending run replaces an older
# pending one, but a running deploy (and its migrations) is never cancelled.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run: only after a successful CI run for a push to this repo's
    # main. The `branches: [main]` filter on the trigger already excludes other
    # branches (including tds/**), and `head_branch == 'main'` below re-asserts
    # it at the job level so a non-main CI run can never reach production.
    # `head_repository` also blocks fork PRs whose branch happens to be "main".
    # workflow_dispatch: only from main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      # Deploy exactly the commit CI verified, not whatever main points to now.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs before Inject so the inject step can write the resolved prefix
      # into wrangler.toml: the GitHub variable is the single source of truth
      # for the Worker's TABLE_PREFIX binding. Depends only on vars.TABLE_PREFIX.
      - name: Resolve TABLE_PREFIX (three-state)
        id: prefix
        env:
          TABLE_PREFIX: ${{ vars.TABLE_PREFIX }}
        run: |
          resolved="$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON .github/scripts/resolve-table-prefix.mjs)"
          echo "resolved TABLE_PREFIX: ${resolved:-<empty>}"
          echo "table_prefix=${resolved}" >> "$GITHUB_OUTPUT"

      - name: Inject resource IDs
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TABLE_PREFIX: ${{ steps.prefix.outputs.table_prefix }}
        run: |
          check() {
            if ! [[ "${!1}" =~ $2 ]]; then
              echo "::error::Variable $1 is missing or malformed (expected $2)"
              exit 1
            fi
          }
          check D1_DATABASE_ID '^[0-9a-fA-F-]{32,36}$'
          check D1_DATABASE_NAME '^[A-Za-z0-9_-]+$'
          check KV_NAMESPACE_ID '^[0-9a-fA-F]{32}$'
          check CLOUDFLARE_ACCOUNT_ID '^[0-9a-fA-F]{32}$'

          f=apps/worker/wrangler.toml
          sed -i "s/D1_DATABASE_ID_PLACEHOLDER/${D1_DATABASE_ID}/g" "$f"
          sed -i "s/D1_DATABASE_NAME_PLACEHOLDER/${D1_DATABASE_NAME}/g" "$f"
          sed -i "s/KV_NAMESPACE_ID_PLACEHOLDER/${KV_NAMESPACE_ID}/g" "$f"
          sed -i "s/CLOUDFLARE_ACCOUNT_ID_PLACEHOLDER/${CLOUDFLARE_ACCOUNT_ID}/g" "$f"
          # TABLE_PREFIX is config-managed: the resolved GitHub variable
          # (default 'hop', 'none' → empty string) becomes the Worker binding.
          sed -i "s/TABLE_PREFIX_PLACEHOLDER/${TABLE_PREFIX}/g" "$f"
          if grep -q '_PLACEHOLDER' "$f"; then
            echo "::error::Unreplaced placeholders remain in $f"
            exit 1
          fi

      # Build before touching the database so a broken build never leaves a
      # migrated schema behind.
      - name: Build
        run: pnpm build

      # Order: migrate first, then deploy code. Migrations must therefore be
      # backward compatible with the code currently live (expand → deploy →
      # contract: add columns/tables now, drop old ones in a later release).
      - name: Prepare D1 migrations
        id: d1
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TABLE_PREFIX: ${{ steps.prefix.outputs.table_prefix }}
        run: bash ../../.github/scripts/d1-prepare-migrations.sh

      - name: Apply D1 migrations
        if: steps.d1.outputs.mode == 'apply'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run db:migrate

      # TABLE_PREFIX in use: apply the prefix-aware migrations from
      # src/lib/migrations.ts (the same ones POST /setup runs).
      - name: Apply prefixed D1 migrations
        if: steps.d1.outputs.mode == 'prefixed'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TABLE_PREFIX: ${{ steps.prefix.outputs.table_prefix }}
        run: bash ../../.github/scripts/d1-prefixed-migrations.sh

      # Fail-closed: refuse to deploy if a required runtime secret is missing
      # or empty, so an empty value can never overwrite a live Cloudflare
      # Secret. The JSON lives only in $RUNNER_TEMP (mode 600) and is never
      # written to the repository workspace.
      - name: Write secrets file
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          "SETUP_SECRET": ${{ secrets.SETUP_SECRET }}
        run: |
          set -euo pipefail
          for name in JWT_SECRET SETUP_SECRET; do
            if [ -z "$(printenv "$name" 2>/dev/null || true)" ]; then
              echo "::error::GitHub Secret '$name' is empty or missing; aborting deploy (fail-closed)."
              exit 1
            fi
          done
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const file = path.join(process.env.RUNNER_TEMP, "secrets.json");
            fs.writeFileSync(
              file,
              JSON.stringify({
                JWT_SECRET: process.env.JWT_SECRET,
                "SETUP_SECRET": process.env["SETUP_SECRET"],
              }, null, 2) + "\n",
              { mode: 0o600 },
            );
          '
          chmod 600 "$RUNNER_TEMP/secrets.json"

      # Web and worker were built above; deploy the worker directly so wrangler
      # can record the uploaded version ID for the verification step.
      - name: Deploy
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: pnpm run deploy -- --secrets-file "$RUNNER_TEMP/secrets.json"

      # Checked through the Cloudflare API rather than the public hostname, so
      # the zone's bot protection can't make it inconclusive.
      - name: Verify deployment
        id: verify
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          TABLE_PREFIX: ${{ steps.prefix.outputs.table_prefix }}
        run: bash ../../.github/scripts/verify-deployment.sh

      - name: Smoke test
        id: smoke
        env:
          APP_URL: ${{ vars.APP_URL }}
          CHECK_DB: ${{ steps.d1.outputs.mode == 'apply' || steps.d1.outputs.mode == 'prefixed' }}
        run: bash .github/scripts/smoke-test.sh

      - name: Rollback hint
        if: failure() && (steps.verify.outcome == 'failure' || steps.smoke.outcome == 'failure')
        run: |
          echo "::error::Post-deploy verification failed. To roll back the Worker to the previous version:"
          echo "  cd apps/worker && pnpm exec wrangler rollback"
          echo "D1 migrations are NOT rolled back automatically; they are designed to stay compatible with the previous code."
