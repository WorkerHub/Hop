name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

# One production deploy at a time; a newer pending run replaces an older
# pending one, but a running deploy (and its migrations) is never cancelled.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run: only after a successful CI run for a push to this repo's
    # main (the `branches` filter alone also matches fork PRs from a branch
    # named "main"). workflow_dispatch: only from main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      # Deploy exactly the commit CI verified, not whatever main points to now.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inject resource IDs
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME || 'shortlink' }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          check() {
            if ! [[ "${!1}" =~ $2 ]]; then
              echo "::error::Variable $1 is missing or malformed (expected $2)"
              exit 1
            fi
          }
          check D1_DATABASE_ID '^[0-9a-fA-F-]{32,36}$'
          check D1_DATABASE_NAME '^[A-Za-z0-9_-]+$'
          check KV_NAMESPACE_ID '^[0-9a-fA-F]{32}$'
          check CLOUDFLARE_ACCOUNT_ID '^[0-9a-fA-F]{32}$'

          f=apps/worker/wrangler.toml
          sed -i "s/D1_DATABASE_ID_PLACEHOLDER/${D1_DATABASE_ID}/g" "$f"
          sed -i "s/D1_DATABASE_NAME_PLACEHOLDER/${D1_DATABASE_NAME}/g" "$f"
          sed -i "s/KV_NAMESPACE_ID_PLACEHOLDER/${KV_NAMESPACE_ID}/g" "$f"
          sed -i "s/CLOUDFLARE_ACCOUNT_ID_PLACEHOLDER/${CLOUDFLARE_ACCOUNT_ID}/g" "$f"
          if grep -q '_PLACEHOLDER' "$f"; then
            echo "::error::Unreplaced placeholders remain in $f"
            exit 1
          fi

      # Build before touching the database so a broken build never leaves a
      # migrated schema behind.
      - name: Build
        run: pnpm build

      # Order: migrate first, then deploy code. Migrations must therefore be
      # backward compatible with the code currently live (expand → deploy →
      # contract: add columns/tables now, drop old ones in a later release).
      - name: Prepare D1 migrations
        id: d1
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TABLE_PREFIX: ${{ vars.TABLE_PREFIX }}
        run: bash ../../.github/scripts/d1-prepare-migrations.sh

      - name: Apply D1 migrations
        if: steps.d1.outputs.mode == 'apply'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run db:migrate

      - name: Deploy
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke test
        id: smoke
        env:
          APP_URL: ${{ vars.APP_URL }}
          CHECK_DB: ${{ steps.d1.outputs.mode == 'apply' }}
        run: |
          if [[ -z "$APP_URL" ]]; then
            echo "::error::Variable APP_URL is not set; cannot verify the deployment"
            exit 1
          fi
          base="${APP_URL%/}"
          probe() {
            curl -fsS --retry 5 --retry-delay 5 --retry-all-errors --max-time 15 "$base$1"
          }
          probe /api/health | jq -e '.status == "ok"'
          probe / >/dev/null
          # /api/config reads the settings table — confirms the schema is usable.
          # Skipped when migrations are managed by the setup route instead.
          if [[ "$CHECK_DB" == "true" ]]; then
            probe /api/config | jq -e 'has("appName")'
          fi

      - name: Rollback hint
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          echo "::error::Smoke test failed after deploy. To roll back the Worker to the previous version:"
          echo "  cd apps/worker && pnpm exec wrangler rollback"
          echo "D1 migrations are NOT rolled back automatically; they are designed to stay compatible with the previous code."
