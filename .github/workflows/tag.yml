name: Manual Release Tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g., v1.0.0)'
        required: true
        type: string

permissions: {}

jobs:
  create-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}

    steps:
      - name: Validate tag format
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "❌ Error: Tag format is invalid. Must be semantic version like v1.0.0"
            echo "Provided: $TAG"
            exit 1
          fi
          echo "✅ Tag format is valid: $TAG"

      # Uses the default GITHUB_TOKEN (contents: write) — no long-lived PAT.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Check if tag already exists
        run: |
          git fetch --tags
          if git tag -l | grep -q "^${TAG}$"; then
            echo "❌ Error: Tag '$TAG' already exists"
            echo "Existing tags:"
            git tag -l | tail -10
            exit 1
          fi
          echo "✅ Tag '$TAG' does not exist, proceeding..."

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          echo "Creating tag: $TAG"
          git tag "$TAG"
          echo "Pushing tag to remote..."
          git push origin "$TAG"
          echo "✅ Successfully created and pushed tag: $TAG"

  # A tag pushed with GITHUB_TOKEN does not trigger release.yml's `push`
  # trigger, so the release is created here by calling it directly.
  release:
    needs: create-tag
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ inputs.tag }}
