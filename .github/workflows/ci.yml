name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only token: no job here needs to write to the repository.
permissions:
  contents: read

jobs:
  ci:
    name: Check, Typecheck, Build
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Deploy scripts: local D1 migration scenarios plus smoke/verify checks.
      # No Cloudflare credentials needed.
      - name: Shellcheck deploy scripts
        run: shellcheck .github/scripts/*.sh

      - name: Test deploy scripts
        run: node --test .github/scripts/test-d1-migrations.mjs .github/scripts/test-deploy-checks.mjs

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Blocking: react-router < 7.18.2 advisories are resolved, so a high+ audit
    # finding should fail the run rather than let a vulnerable build deploy.
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Audits the lockfile against the advisory database; no install needed.
      - name: pnpm audit (prod, high+)
        run: pnpm audit --prod --audit-level=high
